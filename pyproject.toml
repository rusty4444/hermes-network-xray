[project]
name = "hermes-network-xray"
version = "0.1.1"
description = "Evidence-backed network diagnostics across vantage points for Hermes Agent"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
