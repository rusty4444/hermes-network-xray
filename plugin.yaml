name: network-xray
version: "0.1.0"
description: Compare DNS, TCP, verified TLS and HTTP evidence from two machines. Read-only, local-first diagnostics with a visual Desktop workbench and portable collector.
author: Sam Russell
license: MIT
requires_hermes: ">=0.22.5"
